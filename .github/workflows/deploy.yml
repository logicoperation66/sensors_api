name: Build & Deploy API
on:
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: |
          cd EspApi
          dotnet restore
      - name: Build
        run: |
          cd EspApi
          dotnet build --configuration Release --no-restore
      - name: Publish
        run: |
          cd EspApi
          dotnet publish -c Release -o ../out
      - name: Copy Dockerfile to out
        run: cp EspApi/Dockerfile out/  # <- WAŻNE: skopiuj Dockerfile
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: espapi
          path: out/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: espapi
          path: ./espapi
      
      - name: Debug - check files
        run: |
          echo "=== Files in espapi folder ==="
          ls -la ./espapi
      
      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 10378
          key: ${{ secrets.VPS_KEY }}
          source: "./espapi/*"
          target: "/home/${{ secrets.VPS_USER }}/espapi"
          strip_components: 1
      
      - name: Restart Docker container on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 10378
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/espapi
            echo "=== Files on VPS ==="
            ls -la
            echo "=== Building Docker image ==="
            docker build -t espapi .
            echo "=== Removing old container ==="
            docker rm -f espapi || true
            echo "=== Starting new container ==="
            docker run -d -p 8080:8080 --name espapi espapi
